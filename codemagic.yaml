# Doktorumveben — Codemagic bulut CI ile Mac'siz iOS derleme
# Kullanım: bu klasörü GitHub'a push et → codemagic.io'da repoyu bağla → bu dosya otomatik algılanır.
# Ön koşullar (Apple Developer hesabı açıldıktan sonra):
#   1) App Store Connect → Users and Access → Integrations → App Store Connect API → anahtar oluştur (.p8 indir)
#   2) Codemagic → Teams → Integrations → App Store Connect → anahtarı "DoktorumvebenASC" adıyla ekle
#   3) App Store Connect'te uygulamayı oluştur (Bundle ID: com.doktorumveben.app)
#   4) Codemagic'te "Start new build" → ios-release → biter bitmez TestFlight'a otomatik yüklenir.
# Not: İmza sertifikası + provisioning profile'ı Codemagic API anahtarıyla KENDİSİ üretir (Mac gerekmez).

workflows:
  ios-release:
    name: iOS App Store (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: DoktorumvebenASC
    environment:
      groups:
        - ios_credentials   # Codemagic'te bu grupta CERTIFICATE_PRIVATE_KEY (Secure) tanımlı olmalı
      node: 22
      # Build #13 gunlugunden alindi: "Using Xcode 26.4.1 (17E202)".
      # "latest" BIRAKILMADI: Codemagic 6 Eylul 2026'da varsayilani 26.6'ya
      # cekiyor; sabitlemezsek yarinki derleme baska arac zincirinde kosar ve
      # bir sey kirilirsa "bizim kod mu, Xcode mu" ayirt edilemez.
      xcode: 26.4.1
      cocoapods: default
    scripts:
      - name: Bağımlılıkları kur
        # --include=dev ŞART: @capacitor/cli ve @capacitor/assets devDependencies'te.
        script: npm install --include=dev
      - name: iOS platformunu ekle + senkronla
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Marka ikonu + açılış ekranı üret (App Store 2.3.8)
        # `ios/` her build'de şablondan üretildiği için Capacitor'ın YER TUTUCU logosuyla
        # gelir — 1.0 (8) tam bu yüzden reddedildi. Bu adım assets/icon-only.png +
        # assets/logo.png'den gerçek marka setini üretir. Adım patlarsa build DURMAZ:
        # prepare-native-ios.mjs ikonu yine de yazar ve doğrular (marker dosyası yoksa
        # açılış ekranını da düz marka rengine çevirir).
        script: |
          rm -f ios/.assets-generated
          if npx capacitor-assets generate --ios --assetPath assets \
               --iconBackgroundColor '#0891B2' --iconBackgroundColorDark '#0891B2' \
               --splashBackgroundColor '#0891B2' --splashBackgroundColorDark '#0F172A'; then
            touch ios/.assets-generated
            echo "capacitor-assets TAMAM"
          else
            echo "UYARI: capacitor-assets çalışmadı — yedek hat (prepare-native-ios.mjs) devrede."
          fi
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/ || true
      - name: Native hazırlık (ikon doğrulama + izinler + entitlement + PrivacyInfo + iPhone-only)
        script: node scripts/prepare-native-ios.mjs
      - name: SwiftUI katmanını enjekte et (App Store 4.2 — native ekranlar)
        # Tur 235. `ios/` sürüm kontrolünde YOK; her derlemede Capacitor şablonundan
        # üretiliyor. Bu adım native/*.swift dosyalarını App/Native/ altına kopyalar,
        # AppDelegate'i SwiftUI kökü kuracak sürümle değiştirir ve project.pbxproj'a
        # (fileRef + buildFile + grup + Sources fazı) ekler. Yazmadan önce çapaları,
        # yazdıktan sonra sonucu doğrular; tutarsızlıkta derlemeyi DURDURUR — bozuk
        # bir pbxproj Xcode'un projeyi hiç açamamasına yol açar.
        script: node scripts/inject-native-swift.mjs
      - name: Widget hedefini ekle (DVB-000111 — ana ekran widget'ı)
        # Widget AYRI bir Xcode hedefi ister. pbxproj'u elle metin olarak kesmek yerine
        # `xcodeproj` gem'i kullanılıyor — bu iş için yazılmış araç.
        #
        # ⚠ BU ADIM DERLEMEYİ ASLA DURDURMAZ (betik her hatayı yakalayıp exit 0 verir ve
        # pbxproj'u yedekten geri koyar). Gerekçe: widget güzel bir ek, ama onun yüzünden
        # 4.2 düzeltmelerini taşıyan sürümün hiç çıkamaması kabul edilemez.
        # Widget eklenmezse günlükte "[UYARI] widget hedefi eklenmedi: ..." görünür.
        script: |
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby scripts/add-widget-target.rb
      - name: İkon zinciri doğrulama (DVB-000122 — 1.0 (13) mağazaya ikonsuz gitti)
        # ⚠ YERİ ÖNEMLİ: pbxproj'a dokunan SON adımdan (widget) SONRA koşar. Widget
        # betiği pbxproj'u xcodeproj gem'iyle baştan yazıyor; ondan önce ölçmek
        # gerçekte derlenen projeyi değil, ara bir hâli ölçmek olurdu.
        #
        # 1.0 (13) hem "Included Assets → App Icon" hem uygulama kartında Apple'ın
        # yer tutucusunu gösterdi: Apple derlemeden ikon çıkaramamıştı. Zincirin beş
        # halkası (kaynak PNG · Contents.json yuvası · katalogdaki dosya · Resources
        # faz üyeliği · ASSETCATALOG ayarı) ayrı ayrı ölçülür, biri kopuksa DURUR.
        # Bu adım BİLEREK sert: ikonsuz derleme yüklemek boşa tur harcamaktır.
        script: node scripts/verify-ios-icon.mjs
      - name: CocoaPods + yapı teşhisi (.xcworkspace pod install ile üretilir)
        script: |
          echo "=== ios/ (2 seviye) ==="; find ios -maxdepth 2 2>/dev/null || echo "ios/ YOK"
          echo "=== Podfile ara ==="; find . -name Podfile -not -path '*/node_modules/*' 2>/dev/null
          echo "=== xcworkspace ara ==="; find . -name "*.xcworkspace" -not -path '*/node_modules/*' 2>/dev/null
          PODFILE=$(find . -name Podfile -not -path '*/node_modules/*' | head -1)
          if [ -n "$PODFILE" ]; then
            echo "Podfile: $PODFILE → pod install"
            cd "$(dirname "$PODFILE")" && pod install --repo-update
          else
            echo "UYARI: Podfile yok — workspace üretilemez, cap add ios düzgün çalışmamış olabilir."
          fi
      - name: Kod imzalama (kalıcı özel anahtar + sertifika/profil OLUŞTUR)
        # KRİTİK: --certificate-key olmadan CI her build'de yeni/efemer Mac'te çalıştığı için
        # üretilen dağıtım sertifikasının ÖZEL ANAHTARI kaybolur → "Cannot save Signing
        # Certificates without certificate private key" → imza yapılamaz.
        # CERTIFICATE_PRIVATE_KEY (Codemagic 'ios_credentials' grubunda Secure env değişkeni)
        # KALICI RSA anahtarını verir; böylece sertifika her build'de aynı anahtarla
        # yeniden imzalanabilir. --create ilk seferde sertifika + provisioning profile üretir.
        # CERTIFICATE_PRIVATE_KEY = özel anahtarın BASE64'ü (tek satır — Codemagic değer
        # kutusu çok satırlı PEM'i bozabildiği için base64 kullanıyoruz). Çözüp dosyaya yazıp
        # --certificate-key @file: ile veriyoruz.
        script: |
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "com.doktorumveben.app" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build numarasını artır
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: IPA derle
        script: |
          WS=$(find . -name "*.xcworkspace" -not -path '*/node_modules/*' | head -1)
          if [ -z "$WS" ]; then
            echo "HATA: .xcworkspace hiçbir yerde yok (pod install workspace üretmedi)."
            echo "=== ios/ yapısı ==="; find ios -maxdepth 3 2>/dev/null
            exit 1
          fi
          echo "Workspace: $WS"
          xcode-project build-ipa --workspace "$WS" --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - mybaris16@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # Tur 241 — MAĞAZA EKRAN GÖRÜNTÜLERİ (App Store 2.3.8)
  #
  # Neden ayrı bir workflow: ekipte iPhone da Mac de yok, dolayısıyla mağaza
  # görüntüsü çekilemiyordu. Elimizdeki eski görüntüler UYDURMA bir hekim
  # ("Op. Dr. Ayşe Yılmaz") ve artık kullanılmayan WebView arayüzünü
  # gösteriyordu — 2.3.8'den tekrar ret riski.
  #
  # Bu workflow Codemagic'in Mac mini'sinde Simulator açar, uygulamayı
  # `-DVBScreenshot <ekran>` argümanıyla doğrudan hedef ekranda başlatır ve
  # `simctl io screenshot` ile GERÇEK ekranı yakalar; veri de CANLI API'den
  # gelir. Tek kare elle çizilmez.
  #
  # Release hattından KASITLI olarak ayrı: imza istemez (Simulator derlemesi),
  # TestFlight'a hiçbir şey göndermez, bu yüzden burada çıkan bir hata
  # yayın sürecini bozamaz.
  # ---------------------------------------------------------------------------
  ios-screenshots:
    name: iOS Mağaza Ekran Görüntüleri (Simulator)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      # Build #13 gunlugunden alindi: "Using Xcode 26.4.1 (17E202)".
      # "latest" BIRAKILMADI: Codemagic 6 Eylul 2026'da varsayilani 26.6'ya
      # cekiyor; sabitlemezsek yarinki derleme baska arac zincirinde kosar ve
      # bir sey kirilirsa "bizim kod mu, Xcode mu" ayirt edilemez.
      xcode: 26.4.1
      cocoapods: default
    scripts:
      - name: Bağımlılıkları kur
        script: npm install --include=dev
      - name: iOS platformunu ekle + senkronla
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Marka ikonu + açılış ekranı üret
        script: |
          rm -f ios/.assets-generated
          if npx capacitor-assets generate --ios --assetPath assets \
               --iconBackgroundColor '#0891B2' --iconBackgroundColorDark '#0891B2' \
               --splashBackgroundColor '#0891B2' --splashBackgroundColorDark '#0F172A'; then
            touch ios/.assets-generated
          fi
      - name: Native hazırlık
        script: node scripts/prepare-native-ios.mjs
      - name: SwiftUI katmanını enjekte et
        script: node scripts/inject-native-swift.mjs
      - name: Widget hedefini ekle
        # Bkz. yukarıdaki iş akışındaki uzun gerekçe. Hata durumunda derleme DURMAZ.
        script: |
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby scripts/add-widget-target.rb
      - name: İkon zinciri doğrulama (DVB-000122)
        # Ekran görüntüsü iş akışında da koşar: yakalanan görüntülerde ikon yer
        # tutucu çıkarsa mağaza sayfası da yanlış görünürdü.
        script: node scripts/verify-ios-icon.mjs
      - name: CocoaPods (varsa)
        # Capacitor 8 bağımlılıkları Swift Package Manager ile çözüyor; Podfile HİÇ
        # üretilmiyor. İlk denemede burada sert hata verip build'i düşürdüm — release
        # hattı da aynı durumda yalnız uyarı basıp geçiyor. Podfile varsa kur, yoksa atla.
        script: |
          PODFILE=$(find . -name Podfile -not -path '*/node_modules/*' | head -1)
          if [ -n "$PODFILE" ]; then
            echo "Podfile: $PODFILE"
            cd "$(dirname "$PODFILE")" && pod install --repo-update
          else
            echo "Podfile yok (Capacitor SPM kullanıyor) — bu adım atlanıyor."
          fi
      - name: Simulator için derle (imzasız)
        script: |
          set -e
          # Workspace varsa onu, yoksa .xcodeproj'u hedefle (SPM'de workspace olmayabilir).
          WS=$(find . -name "*.xcworkspace" -not -path '*/node_modules/*' | head -1)
          if [ -n "$WS" ]; then
            echo "Workspace: $WS"
            set -- -workspace "$WS"
          else
            PROJ=$(find . -name "App.xcodeproj" -not -path '*/node_modules/*' | head -1)
            if [ -z "$PROJ" ]; then echo "HATA: ne workspace ne xcodeproj var"; find ios -maxdepth 3; exit 1; fi
            echo "Project: $PROJ"
            set -- -project "$PROJ"
          fi
          xcodebuild "$@" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          find /tmp/dd/Build/Products -maxdepth 2 -name "App.app" -type d
      - name: Ekran görüntülerini yakala — iPhone 6.9"
        # Betik scripts/capture-screenshots.sh'e taşındı; gerekçesi orada.
        script: DVB_SHOT_DEVICE=iphone bash "$CM_BUILD_DIR/scripts/capture-screenshots.sh"
      - name: Ekran görüntülerini yakala — iPad 13"
        # DVB-000121: uygulama artık iPad destekliyor, App Store bu takımı ZORUNLU
        # kılıyor. Aynı betik, yalnız cihaz sınıfı değişiyor — iki takım da aynı
        # derlemeden gelsin diye ayrı iş akışına bölünmedi.
        script: DVB_SHOT_DEVICE=ipad bash "$CM_BUILD_DIR/scripts/capture-screenshots.sh"
    artifacts:
      - screenshots/**/*.png
    publishing:
      email:
        recipients:
          - mybaris16@gmail.com
        notify:
          success: true
          failure: true
