# Doktorumveben — Codemagic bulut CI ile Mac'siz iOS derleme
# Kullanım: bu klasörü GitHub'a push et → codemagic.io'da repoyu bağla → bu dosya otomatik algılanır.
# Ön koşullar (Apple Developer hesabı açıldıktan sonra):
#   1) App Store Connect → Users and Access → Integrations → App Store Connect API → anahtar oluştur (.p8 indir)
#   2) Codemagic → Teams → Integrations → App Store Connect → anahtarı "DoktorumvebenASC" adıyla ekle
#   3) App Store Connect'te uygulamayı oluştur (Bundle ID: com.doktorumveben.app)
#   4) Codemagic'te "Start new build" → ios-release → biter bitmez TestFlight'a otomatik yüklenir.
# Not: İmza sertifikası + provisioning profile'ı Codemagic API anahtarıyla KENDİSİ üretir (Mac gerekmez).

workflows:
  ios-release:
    name: iOS App Store (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: DoktorumvebenASC
    environment:
      groups:
        - ios_credentials   # Codemagic'te bu grupta CERTIFICATE_PRIVATE_KEY (Secure) tanımlı olmalı
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bağımlılıkları kur
        # --include=dev ŞART: @capacitor/cli ve @capacitor/assets devDependencies'te.
        script: npm install --include=dev
      - name: iOS platformunu ekle + senkronla
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Marka ikonu + açılış ekranı üret (App Store 2.3.8)
        # `ios/` her build'de şablondan üretildiği için Capacitor'ın YER TUTUCU logosuyla
        # gelir — 1.0 (8) tam bu yüzden reddedildi. Bu adım assets/icon-only.png +
        # assets/logo.png'den gerçek marka setini üretir. Adım patlarsa build DURMAZ:
        # prepare-native-ios.mjs ikonu yine de yazar ve doğrular (marker dosyası yoksa
        # açılış ekranını da düz marka rengine çevirir).
        script: |
          rm -f ios/.assets-generated
          if npx capacitor-assets generate --ios --assetPath assets \
               --iconBackgroundColor '#0891B2' --iconBackgroundColorDark '#0891B2' \
               --splashBackgroundColor '#0891B2' --splashBackgroundColorDark '#0F172A'; then
            touch ios/.assets-generated
            echo "capacitor-assets TAMAM"
          else
            echo "UYARI: capacitor-assets çalışmadı — yedek hat (prepare-native-ios.mjs) devrede."
          fi
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/ || true
      - name: Native hazırlık (ikon doğrulama + izinler + entitlement + PrivacyInfo + iPhone-only)
        script: node scripts/prepare-native-ios.mjs
      - name: CocoaPods + yapı teşhisi (.xcworkspace pod install ile üretilir)
        script: |
          echo "=== ios/ (2 seviye) ==="; find ios -maxdepth 2 2>/dev/null || echo "ios/ YOK"
          echo "=== Podfile ara ==="; find . -name Podfile -not -path '*/node_modules/*' 2>/dev/null
          echo "=== xcworkspace ara ==="; find . -name "*.xcworkspace" -not -path '*/node_modules/*' 2>/dev/null
          PODFILE=$(find . -name Podfile -not -path '*/node_modules/*' | head -1)
          if [ -n "$PODFILE" ]; then
            echo "Podfile: $PODFILE → pod install"
            cd "$(dirname "$PODFILE")" && pod install --repo-update
          else
            echo "UYARI: Podfile yok — workspace üretilemez, cap add ios düzgün çalışmamış olabilir."
          fi
      - name: Kod imzalama (kalıcı özel anahtar + sertifika/profil OLUŞTUR)
        # KRİTİK: --certificate-key olmadan CI her build'de yeni/efemer Mac'te çalıştığı için
        # üretilen dağıtım sertifikasının ÖZEL ANAHTARI kaybolur → "Cannot save Signing
        # Certificates without certificate private key" → imza yapılamaz.
        # CERTIFICATE_PRIVATE_KEY (Codemagic 'ios_credentials' grubunda Secure env değişkeni)
        # KALICI RSA anahtarını verir; böylece sertifika her build'de aynı anahtarla
        # yeniden imzalanabilir. --create ilk seferde sertifika + provisioning profile üretir.
        # CERTIFICATE_PRIVATE_KEY = özel anahtarın BASE64'ü (tek satır — Codemagic değer
        # kutusu çok satırlı PEM'i bozabildiği için base64 kullanıyoruz). Çözüp dosyaya yazıp
        # --certificate-key @file: ile veriyoruz.
        script: |
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "com.doktorumveben.app" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build numarasını artır
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: IPA derle
        script: |
          WS=$(find . -name "*.xcworkspace" -not -path '*/node_modules/*' | head -1)
          if [ -z "$WS" ]; then
            echo "HATA: .xcworkspace hiçbir yerde yok (pod install workspace üretmedi)."
            echo "=== ios/ yapısı ==="; find ios -maxdepth 3 2>/dev/null
            exit 1
          fi
          echo "Workspace: $WS"
          xcode-project build-ipa --workspace "$WS" --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - mybaris16@gmail.com
        notify:
          success: true
          failure: true
